<!doctype html>
<html lang="en"><meta charset="utf-8"><title>GTASF CC0 asset contact sheet</title>
<style>body{margin:0;background:#d7d9d2;font:15px system-ui;color:#263434}h1{margin:14px 22px;font-size:21px}canvas{display:block}#labels{position:absolute;top:60px;left:0;display:grid;grid-template-columns:repeat(4,350px);grid-auto-rows:275px;pointer-events:none}#labels div{padding:12px 20px}small{display:block;color:#52625d}</style>
<h1>GTASF · CC0 fleet and Quaternius hoodie · local visual review</h1><canvas></canvas><div id="labels"></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const renderer = new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1400,825);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const items=['prius','model3','outback','muni-bus','robotaxi','powell-cable-car','vc-supercar','idle','walk','run','sit'];
window.review=[];
for(let i=0;i<items.length;i++){
 const id=items[i],avatar=i>=7;
 const path=avatar?'avatars/hoodie':`vehicles/${id}`;
 const gltf=await loader.loadAsync('/web/public/assets/'+path+'.glb');
 const scene=new THREE.Scene();scene.background=new THREE.Color('#d7d9d2');
 scene.add(new THREE.HemisphereLight('#fff6df','#5c6a74',2.3));const sun=new THREE.DirectionalLight('#ffffff',2.5);sun.position.set(4,9,6);scene.add(sun);
 scene.add(gltf.scene);
 if(avatar){const mixer=new THREE.AnimationMixer(gltf.scene);mixer.clipAction(gltf.animations.find(a=>a.name===id)).play();mixer.update(id==='run'?.18:id==='walk'?.25:.1);}
 gltf.scene.updateMatrixWorld(true);gltf.scene.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();o.computeBoundingBox();}});
 const bounds=new THREE.Box3().setFromObject(gltf.scene,true);const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 window.review.push({id,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()},clips:gltf.animations.map(a=>a.name)});
 const span=avatar?2.35:Math.max(size.x,size.z)*1.2;
 const camera=new THREE.OrthographicCamera(-span*.636,span*.636,span*.5,-span*.5,.01,1000);
 camera.position.copy(center).add(new THREE.Vector3(1,.65,1).normalize().multiplyScalar(span*2));camera.lookAt(center);camera.updateMatrixWorld();
 const plane=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:'#b6bcae'}));plane.rotation.x=-Math.PI/2;plane.position.y=-.025;scene.add(plane);
 const x=i%4*350,y=825-(Math.floor(i/4)+1)*275;
 renderer.setViewport(x,y,350,275);renderer.setScissor(x,y,350,275);renderer.setScissorTest(true);renderer.render(scene,camera);
 const label=document.createElement('div');label.textContent=id;const detail=document.createElement('small');detail.textContent=avatar?'Quaternius · '+id:`${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} m`;label.append(detail);document.querySelector('#labels').append(label);
}
window.reviewReady=true;
</script></html>
